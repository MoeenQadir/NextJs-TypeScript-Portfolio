<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="MoonRouter smart LLM proxy routing dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="210" cy="140" r="330" fill="url(#glowA)"/>
  <circle cx="1010" cy="470" r="300" fill="url(#glowB)"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="70" y="60" width="1060" height="630" rx="22" fill="#0a0e1a" stroke="#1c2743" stroke-width="2"/>

    <!-- browser chrome -->
    <rect x="70" y="60" width="1060" height="60" rx="22" fill="#0f1526"/>
    <rect x="70" y="100" width="1060" height="20" fill="#0f1526"/>
    <circle cx="104" cy="90" r="7" fill="#f87171"/>
    <circle cx="128" cy="90" r="7" fill="#fbbf24"/>
    <circle cx="152" cy="90" r="7" fill="#34d399"/>

    <!-- logo -->
    <rect x="102" y="112" width="30" height="30" rx="9" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5"/>
    <circle cx="117" cy="127" r="9" fill="#38bdf8"/>
    <circle cx="121.5" cy="123.5" r="7.5" fill="#0a0e1a"/>
    <text x="142" y="132" fill="#ffffff" font-size="16" font-weight="700">Moon<tspan fill="#38bdf8">Router</tspan></text>

    <!-- logical model nav -->
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="600">
      <text x="610" y="131" fill="#7dd3fc">coding</text>
      <text x="678" y="131" fill="#c4b5fd">reasoning</text>
      <text x="768" y="131" fill="#fcd34d">backup</text>
    </g>
    <rect x="930" y="108" width="160" height="34" rx="10" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.35"/>
    <circle cx="948" cy="125" r="4" fill="#34d399"/>
    <text x="960" y="129" fill="#34d399" font-size="11" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">/health  UP</text>

    <!-- badge -->
    <rect x="320" y="176" width="560" height="26" rx="13" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="600" y="194" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">MULTI-API SMART LLM PROXY · ROTATION · ZERO-DOWNTIME FAILOVER</text>

    <text x="600" y="248" fill="#ffffff" font-size="38" font-weight="800" text-anchor="middle">One endpoint. Every LLM provider.</text>
    <text x="600" y="280" fill="#7d8aa5" font-size="14" text-anchor="middle">OpenAI-compatible gateway · automatic failover · API-key rotation · 5-min cooldowns · 100% free-tier chain</text>

    <!-- stat cards -->
    <g>
      <rect x="120" y="312" width="220" height="76" rx="14" fill="#0f1526" stroke="#1c2743"/>
      <text x="144" y="344" fill="#7d8aa5" font-size="10" font-weight="600" letter-spacing="1.5">LOGICAL MODELS</text>
      <text x="144" y="374" fill="#38bdf8" font-size="24" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">3</text>

      <rect x="352" y="312" width="220" height="76" rx="14" fill="#0f1526" stroke="#1c2743"/>
      <text x="376" y="344" fill="#7d8aa5" font-size="10" font-weight="600" letter-spacing="1.5">FREE PROVIDERS</text>
      <text x="376" y="374" fill="#ffffff" font-size="24" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">4</text>

      <rect x="584" y="312" width="220" height="76" rx="14" fill="#0f1526" stroke="#1c2743"/>
      <text x="608" y="344" fill="#7d8aa5" font-size="10" font-weight="600" letter-spacing="1.5">FAILOVER CUTOVER</text>
      <text x="608" y="374" fill="#34d399" font-size="24" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">&lt; 1 s</text>

      <rect x="816" y="312" width="264" height="76" rx="14" fill="#0f1526" stroke="#1c2743"/>
      <text x="840" y="344" fill="#7d8aa5" font-size="10" font-weight="600" letter-spacing="1.5">MONTHLY LLM COST</text>
      <text x="840" y="374" fill="#ffb900" font-size="24" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">$0</text>
    </g>

    <!-- routing diagram -->
    <!-- client box -->
    <rect x="120" y="430" width="190" height="120" rx="14" fill="#0f1526" stroke="#1c2743"/>
    <text x="215" y="452" fill="#5b6780" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle">CLIENT</text>
    <text x="215" y="478" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">OpenCode</text>
    <text x="215" y="496" fill="#7d8aa5" font-size="10" text-anchor="middle">VS Code · terminal · CI</text>
    <text x="215" y="518" fill="#5b6780" font-size="9" font-family="JetBrains Mono, Consolas, monospace" text-anchor="middle">OpenAI-compatible</text>
    <text x="215" y="532" fill="#5b6780" font-size="9" font-family="JetBrains Mono, Consolas, monospace" text-anchor="middle">127.0.0.1:4000/v1</text>

    <line x1="314" y1="490" x2="402" y2="490" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7" marker-end="url(#arrC)"/>

    <!-- router box -->
    <rect x="410" y="405" width="370" height="170" rx="16" fill="#0d1220" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="434" cy="429" r="6" fill="#38bdf8"/>
    <circle cx="437.5" cy="426.5" r="4.5" fill="#0d1220"/>
    <text x="448" y="434" fill="#ffffff" font-size="14" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">moon-ai-router · :4000</text>
    <text x="430" y="451" fill="#7d8aa5" font-size="10">LiteLLM router · master-key auth · drop-params shims</text>

    <g font-family="JetBrains Mono, Consolas, monospace">
      <rect x="430" y="462" width="330" height="26" rx="8" fill="#0f1526" stroke="#1c2743"/>
      <circle cx="446" cy="475" r="4" fill="#34d399"/>
      <text x="458" y="479" fill="#ffffff" font-size="12" font-weight="700">coding</text>
      <text x="748" y="479" fill="#5b6780" font-size="9" text-anchor="end">→ cerebras → groq ×2 → openrouter</text>

      <rect x="430" y="494" width="330" height="26" rx="8" fill="#0f1526" stroke="#1c2743"/>
      <circle cx="446" cy="507" r="4" fill="#34d399"/>
      <text x="458" y="511" fill="#ffffff" font-size="12" font-weight="700">reasoning</text>
      <text x="748" y="511" fill="#5b6780" font-size="9" text-anchor="end">→ gemini → openrouter → cerebras</text>

      <rect x="430" y="526" width="330" height="26" rx="8" fill="#0f1526" stroke="#1c2743"/>
      <circle cx="446" cy="539" r="4" fill="#fbbf24"/>
      <text x="458" y="543" fill="#ffffff" font-size="12" font-weight="700">backup</text>
      <text x="748" y="543" fill="#5b6780" font-size="9" text-anchor="end">→ gemini → openrouter (end of line)</text>
    </g>

    <!-- fan-out to providers -->
    <line x1="784" y1="460" x2="862" y2="432" stroke="#8b5cf6" stroke-width="1.6" stroke-opacity="0.55" marker-end="url(#arrV)"/>
    <line x1="784" y1="490" x2="862" y2="484" stroke="#8b5cf6" stroke-width="1.6" stroke-opacity="0.55" marker-end="url(#arrV)"/>
    <line x1="784" y1="520" x2="862" y2="536" stroke="#8b5cf6" stroke-width="1.6" stroke-opacity="0.55" marker-end="url(#arrV)"/>
    <line x1="784" y1="550" x2="862" y2="588" stroke="#8b5cf6" stroke-width="1.6" stroke-opacity="0.55" marker-end="url(#arrV)"/>

    <!-- provider boxes -->
    <g font-family="JetBrains Mono, Consolas, monospace">
      <rect x="870" y="410" width="260" height="44" rx="12" fill="#0f1526" stroke="#1c2743"/>
      <circle cx="890" cy="432" r="4.5" fill="#34d399"/>
      <text x="902" y="437" fill="#ffffff" font-size="12" font-weight="700">Cerebras</text>
      <text x="1116" y="437" fill="#34d399" font-size="10" text-anchor="end">up · 3k tok/s</text>

      <rect x="870" y="462" width="260" height="44" rx="12" fill="#0f1526" stroke="#1c2743"/>
      <circle cx="890" cy="484" r="4.5" fill="#34d399"/>
      <text x="902" y="489" fill="#ffffff" font-size="12" font-weight="700">Groq × 2 keys</text>
      <text x="1116" y="489" fill="#34d399" font-size="10" text-anchor="end">up · rotation</text>

      <rect x="870" y="514" width="260" height="44" rx="12" fill="#0f1526" stroke="#1c2743"/>
      <circle cx="890" cy="536" r="4.5" fill="#34d399"/>
      <text x="902" y="541" fill="#ffffff" font-size="12" font-weight="700">Gemini flash</text>
      <text x="1116" y="541" fill="#34d399" font-size="10" text-anchor="end">up · alias</text>

      <rect x="870" y="566" width="260" height="44" rx="12" fill="#0f1526" stroke="#1c2743"/>
      <circle cx="890" cy="588" r="4.5" fill="#f87171"/>
      <text x="902" y="593" fill="#ffffff" font-size="12" font-weight="700">OpenRouter :free</text>
      <text x="1116" y="593" fill="#f87171" font-size="10" text-anchor="end">429 · cooldown</text>
    </g>

    <!-- footer chips -->
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="600">
      <rect x="120" y="632" width="88" height="26" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="164" y="649" fill="#7dd3fc" text-anchor="middle">LiteLLM</text>
      <rect x="220" y="632" width="78" height="26" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="259" y="649" fill="#7dd3fc" text-anchor="middle">Docker</text>
      <rect x="310" y="632" width="104" height="26" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="362" y="649" fill="#7dd3fc" text-anchor="middle">OpenAI-API</text>
      <rect x="426" y="632" width="118" height="26" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="485" y="649" fill="#7dd3fc" text-anchor="middle">Auto-Failover</text>
      <rect x="556" y="632" width="112" height="26" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="612" y="649" fill="#7dd3fc" text-anchor="middle">Key Rotation</text>
      <rect x="680" y="632" width="116" height="26" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="738" y="649" fill="#7dd3fc" text-anchor="middle">Health Checks</text>
      <rect x="808" y="632" width="64" height="26" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="840" y="649" fill="#7dd3fc" text-anchor="middle">YAML</text>
    </g>
  </g>
</svg>
